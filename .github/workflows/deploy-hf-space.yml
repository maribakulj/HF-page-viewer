name: Deploy Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-hf-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Hugging Face Space metadata
        run: node scripts/validate-space-metadata.mjs

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Test browser core
        working-directory: frontend
        run: npm test

      - name: Build static application
        working-directory: frontend
        run: npm run build

      - name: Verify static artifact
        run: test -f dist/index.html

      - name: Assemble clean Space source
        run: |
          rm -rf .hf-space-publish
          mkdir -p .hf-space-publish/frontend
          cp README.md LICENSE .hf-space-publish/
          rsync -a \
            --exclude='node_modules/' \
            --exclude='dist/' \
            frontend/ .hf-space-publish/frontend/
          test ! -e .hf-space-publish/frontend/node_modules
          test -f .hf-space-publish/frontend/package.json
          test -f .hf-space-publish/frontend/src/main.tsx
          echo "Publishing $(find .hf-space-publish -type f | wc -l) source files to Hugging Face."

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Publish to Ma-Ri-Ba-Ku/Inspector-ALTO
        env:
          HF_OIDC_RESOURCE: spaces/Ma-Ri-Ba-Ku/Inspector-ALTO
        run: |
          hf upload Ma-Ri-Ba-Ku/Inspector-ALTO .hf-space-publish . \
            --repo-type=space \
            --delete="*" \
            --commit-message="Deploy GitHub ${GITHUB_SHA::7}"
