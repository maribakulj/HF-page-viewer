name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "chore/**"
      - "feat/**"
      - "fix/**"
      - "refactor/**"

permissions:
  contents: read

jobs:
  browser-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Test browser core
        working-directory: frontend
        run: npm test
      - name: Build static Space
        working-directory: frontend
        run: npm run build
      - name: Verify Hugging Face artifact
        run: test -f dist/index.html

  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reference implementation
        run: pip install -e './backend[dev]'
      - name: Lint reference implementation
        run: ruff check backend
      - name: Test reference implementation
        run: pytest backend
